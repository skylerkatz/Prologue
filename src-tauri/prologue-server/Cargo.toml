[package]
name = "prologue-server"
version = "0.1.0"
description = "Headless Prologue: the app's commands over HTTP, events over SSE, and the built frontend — no Tauri, no display"
edition = "2021"

[dependencies]
prologue-core = { path = "../prologue-core" }
prologue-runtime = { path = "../prologue-runtime" }
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs"] }
# Send to Amp: the server, never the browser, calls the webhook (a credential).
ureq = { version = "3", features = ["json"] }
# Decodes the Amp portal's percent-encoded identity headers.
percent-encoding = "2"

[dev-dependencies]
prologue-core = { path = "../prologue-core", features = ["testutil"] }
tempfile = "3"
