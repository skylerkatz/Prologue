[workspace]
members = ["prologue-core", "prologue", "prologue-runtime", "prologue-server"]
# Unqualified `cargo test` / `cargo clippy` from src-tauri (e.g. the Solo
# "Rust Checks" process) must cover every crate, not just the root package.
default-members = [".", "prologue-core", "prologue", "prologue-runtime", "prologue-server"]

# One version for every crate (the app, the CLI, the server), bumped by
# scripts/release.sh alongside package.json and tauri.conf.json.
[workspace.package]
version = "0.8.0"

[package]
name = "prologue-app"
version.workspace = true
description = "Prologue — a local git diff review app"
authors = ["Skyler Katz"]
edition = "2021"
# The workspace has a second binary (prologue, the CLI); `tauri dev`'s bare
# `cargo run` needs to know this one is the app.
default-run = "Prologue"

# macOS shows the executable's file name in the Dock for unbundled dev builds,
# so the bin target must carry the user-facing name, not the crate name.
[[bin]]
name = "Prologue"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "prologue_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
prologue-core = { path = "prologue-core" }
# Guide engine, watchers, and event names, shared with prologue-server.
prologue-runtime = { path = "prologue-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
# External http(s) links from rendered markdown open in the system browser;
# the webview itself never navigates off the app origin (see on_navigation).
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
# Dev-only agent automation bridge; compiled in only via the `mcp-bridge`
# feature (see [features]) so release builds carry no WebSocket listener.
tauri-plugin-mcp-bridge = { version = "0.12", optional = true }

[features]
# Enabled by `tauri dev --features mcp-bridge` (see solo.yml); never enabled
# for release builds.
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]

[dev-dependencies]
tempfile = "3"
