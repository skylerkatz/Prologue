# Web mode release bundles: on a v* tag, build the x86_64 and aarch64 Linux
# web bundles (web-bundle.yml) and attach both to that tag's GitHub release.
#
# The Mac release (scripts/release.sh) publishes to the same release; this
# job creates the release only if it does not exist yet, never as "latest",
# so it can't replace the release the Mac updater's latest.json lives on.
name: Release (web, Linux)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach to
        required: true

permissions:
  contents: write

jobs:
  bundle:
    uses: ./.github/workflows/web-bundle.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  attach:
    needs: bundle
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: prologue-web-*-linux.tar.gz
          merge-multiple: true

      - name: Attach to the release
        run: |
          # Require both bundles and include a checksum for each.
          assets=()
          for asset in prologue-web-{x86_64,aarch64}-linux.tar.gz; do
            sha256sum "$asset" > "$asset.sha256"
            assets+=("$asset" "$asset.sha256")
          done
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # The Mac release script may create it at the same moment; fall
            # through to upload if that race is lost.
            gh release create "$TAG" --verify-tag --latest=false "${prerelease[@]}" \
              --title "Prologue $TAG" \
              --notes "Linux web-mode bundle (prologue-server, prologue CLI, frontend)." \
              || true
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
