# Web mode release bundle: on a v* tag, build prologue-server, the prologue
# CLI, and the frontend for x86_64 Linux and attach them to that tag's
# GitHub release as prologue-web-x86_64-linux.tar.gz. The tarball holds
# prologue-server, prologue, and dist/ at its top level; prologue-server
# serves the dist/ next to its binary by default.
#
# The Mac release (scripts/release.sh) publishes to the same release; this
# job creates the release only if it does not exist yet, never as "latest",
# so it can't replace the release the Mac updater's latest.json lives on.
name: Release (web, Linux)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach to
        required: true

permissions:
  contents: write

jobs:
  linux-bundle:
    # 22.04's glibc (2.35) keeps the binaries runnable on older distros,
    # including Debian 12 orbs.
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      ASSET: prologue-web-x86_64-linux.tar.gz
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build the frontend
        run: npm ci && npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Only these two packages: neither depends on Tauri, so no webkit/gtk.
      - name: Build prologue-server and the prologue CLI
        working-directory: src-tauri
        run: cargo build --release --locked -p prologue-server -p prologue

      - name: Package
        run: |
          mkdir -p bundle
          cp src-tauri/target/release/prologue-server src-tauri/target/release/prologue bundle/
          cp -R dist bundle/dist
          tar -C bundle -czf "$ASSET" prologue-server prologue dist
          tar -tzf "$ASSET" | head -5

      - name: Attach to the release
        run: |
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # The Mac release script may create it at the same moment; fall
            # through to upload if that race is lost.
            gh release create "$TAG" --verify-tag --latest=false "${prerelease[@]}" \
              --title "Prologue $TAG" \
              --notes "Linux web-mode bundle (prologue-server, prologue CLI, frontend)." \
              || true
          fi
          gh release upload "$TAG" "$ASSET" --clobber
