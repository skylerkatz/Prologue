# Web mode release bundle: on a v* tag, build the Linux web bundle
# (web-bundle.yml) and attach prologue-web-x86_64-linux.tar.gz to that tag's
# GitHub release.
#
# The Mac release (scripts/release.sh) publishes to the same release; this
# job creates the release only if it does not exist yet, never as "latest",
# so it can't replace the release the Mac updater's latest.json lives on.
name: Release (web, Linux)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach to
        required: true

permissions:
  contents: write

jobs:
  bundle:
    uses: ./.github/workflows/web-bundle.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  attach:
    needs: bundle
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      ASSET: prologue-web-x86_64-linux.tar.gz
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: prologue-web-x86_64-linux.tar.gz

      - name: Attach to the release
        run: |
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # The Mac release script may create it at the same moment; fall
            # through to upload if that race is lost.
            gh release create "$TAG" --verify-tag --latest=false "${prerelease[@]}" \
              --title "Prologue $TAG" \
              --notes "Linux web-mode bundle (prologue-server, prologue CLI, frontend)." \
              || true
          fi
          gh release upload "$TAG" "$ASSET" --clobber
