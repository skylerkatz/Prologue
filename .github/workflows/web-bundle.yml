# Builds the Linux web-mode bundle, prologue-web-x86_64-linux.tar.gz, and
# uploads it as a workflow artifact of the same name. The tarball holds
# prologue-server, the prologue CLI, and dist/ at its top level;
# prologue-server serves the dist/ next to its binary by default.
#
# Called by ci.yml (every main push and PR) and release-web.yml (v* tags);
# the callers decide where the bundle is published.
name: Web bundle (Linux)

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch, or tag to build
        type: string
        default: ""

jobs:
  linux-bundle:
    # 22.04's glibc (2.35) keeps the binaries runnable on older distros,
    # including Debian 12 orbs.
    runs-on: ubuntu-22.04
    env:
      ASSET: prologue-web-x86_64-linux.tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build the frontend
        run: npm ci && npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Branch and tag runs restore main's cache; only main writes it,
          # so PRs don't evict it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Only these two packages: neither depends on Tauri, so no webkit/gtk.
      - name: Build prologue-server and the prologue CLI
        working-directory: src-tauri
        run: cargo build --release --locked -p prologue-server -p prologue

      - name: Package
        run: |
          mkdir -p bundle
          cp src-tauri/target/release/prologue-server src-tauri/target/release/prologue bundle/
          cp -R dist bundle/dist
          tar -C bundle -czf "$ASSET" prologue-server prologue dist
          tar -tzf "$ASSET" | head -5

      # Unzipped: the artifact is the tarball itself, named after it.
      - uses: actions/upload-artifact@v7
        with:
          path: prologue-web-x86_64-linux.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14
